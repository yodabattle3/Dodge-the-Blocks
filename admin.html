<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Key Admin Panel</title>
  <style>
    body { background: #0d0d0d; color: white; font-family: Arial; padding: 30px; }
    .box { background: #1a1a1a; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: none; }
    button { background: #4c8bff; color: white; font-weight: bold; }
    button:hover { background: #2f6ef5; }
    .log { background: black; padding: 10px; border-radius: 5px; max-height: 250px; overflow-y: scroll; white-space: pre-wrap; }
  </style>
</head>
<body>

<h1>🔑 Roblox Key Generator</h1>

<div class="box">
  <h2>Create Key</h2>
  <input type="password" id="pw" placeholder="Admin Password">
  <input id="hrs" type="number" placeholder="Expiration (hours)">
  <button onclick="makeKey()">Generate</button>
  <p id="result"></p>
</div>

<div class="box">
  <h2>Key Log</h2>
  <button onclick="loadKeys()">Refresh</button>
  <div id="log" class="log"></div>
</div>

<script>
function makeKey() {
  fetch("/addKey", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      adminPW: document.getElementById("pw").value,
      hours: parseInt(document.getElementById("hrs").value)
    })
  })
    .then(res => res.json())
    .then(data => {
      document.getElementById("result").innerHTML = "Generated Key: " + data.key;
      loadKeys();
    })
    .catch(err => alert("Error generating key"));
}

function loadKeys() {
  fetch("/keys")
    .then(res => res.json())
    .then(keys => {
      document.getElementById("log").innerHTML =
        keys.map(k => 
          `Key: ${k.key}\nExpires: ${new Date(k.expiresAt)}\n---`
        ).join("\n");
    });
}
</script>

</body>
</html>
